# Employment. Ongoing roles carry a year range, not a live state, so nothing
# here goes stale on its own. Add a bullet when something ships.

- id: oris
  order: 1
  org: Oris
  role: Software and Platform Engineer
  dates: Aug 2023 — present
  current: true
  # The architecture-ownership claim is made once, in the page dek above this
  # list. Do not restate it here.
  summary: >-
    Technical lead on a multi-tenant HR, payroll, hiring, learning and
    field-sales platform — five product lines, more than ten thousand users,
    TypeScript and Go.
  bullets:
    - >-
      Stopped employees being paid the wrong amount — records failing a
      consistency check are held out of a pay run, and sign-off moved from an
      email trail that left no record to a fully auditable multi-reviewer path.
    - >-
      Ended payroll generation failures under concurrent load by rebuilding the
      write path on explicit transactions, replacing decorator-managed ones that
      silently lost context across asynchronous job dispatch.
    - >-
      Made notification delivery reliable, replacing best-effort in-request
      sends that dropped mail whenever a request failed with a standalone Go
      service on SQS — at-least-once delivery, and a claim protocol that never
      blind-resends to a recipient.
    - >-
      Retired the legacy employee data model with no downtime and no data
      freeze, moving every read path, projection and report before demoting job
      offers to provenance only.
    - >-
      Shipped a field-sales product across three repositories — backend, React
      admin console, and an Expo React Native app that keeps working when a
      representative loses signal in the field.
    - >-
      Made tenant scope a compile-time requirement platform-wide rather than a
      derivable guess, and removed standing cloud credentials from deployment
      across five repositories.

